services:
  - type: web
    name: ai-alshehri-api
    runtime: python
    rootDir: .
    buildCommand: python -m pip install --upgrade pip && python -m pip install --no-cache-dir -r backend/requirements.txt && python -m pip install --no-cache-dir requests==2.32.4 email-validator==2.2.0
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
