services:
  - type: web
    name: ai-alshehri-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt && python -m pip install --no-cache-dir email-validator==2.2.0
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
