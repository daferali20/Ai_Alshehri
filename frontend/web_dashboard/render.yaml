# Exported and Fixed for Render
version: "1"
projects:
- name: Ai_Alshehri_Project
  environments:
  - name: Production
    services:
    - type: pss  # تم التغيير إلى Static Site ليتناسب مع React
      name: Ai_Alshehri-web
      runtime: static
      repo: https://github.com/daferali20/Ai_Alshehri
      plan: free
      region: oregon
      rootDir: frontend/web_dashboard
      buildCommand: npm install && npm run build
      publishPath: build  # المجلد الناتج بعد عملية البناء
      autoDeployTrigger: commit
      envVars:
      - key: CI
        value: "false"  # لتجاهل Warning وعدم إيقاف الـ Build
      - key: REACT_APP_API_URL
        sync: false
      previews:
        generation: automatic
