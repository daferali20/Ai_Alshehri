services:
  - type: web
    name: ai-alshehri-frontend
    runtime: node
    rootDir: frontend/web_dashboard
    buildCommand: npm install && npm run build
    startCommand: npm start
    publishDir: build  # هذا المسار يعتبر نسبة إلى rootDir
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
