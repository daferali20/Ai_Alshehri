name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Import application
        env:
          DATABASE_URL: sqlite:///./ci.db
          JWT_SECRET_KEY: ci-test-secret
          ENVIRONMENT: test
          FINNHUB_API_KEY: ''
        run: python -c "from backend.main import app; print(app.title)"
      - name: Smoke test security
        env:
          JWT_SECRET_KEY: ci-test-secret
          ENVIRONMENT: test
        run: python -c "from backend.security import hash_password, verify_password, create_access_token, decode_access_token; h=hash_password('CI-test-password'); assert verify_password('CI-test-password', h); token=create_access_token('ci-user'); assert decode_access_token(token)=='ci-user'; print('security ok')"
      - name: Smoke test database
        env:
          DATABASE_URL: sqlite:///./ci.db
          JWT_SECRET_KEY: ci-test-secret
          ENVIRONMENT: test
        run: python -c "from backend.database import init_db; init_db(); print('database ok')"
